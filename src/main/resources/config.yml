configVersion: 1.1.0

# The worlds in which combat mode is allowed and available.
# If a player is in a world that is not listed here, they will not be able to enter combat mode.
allowed_worlds:
  - world

# disable pvp by default for all players, which are not in combat mode
# only applies to the worlds listed in allowed_worlds
# other worlds use the default pvp settings of the server
disable_pvp_by_default: true

# allow players to switch gamemodes while in combat mode
# if allowed, the combat mode gets disabled when switching to a non-survival gamemode
# and must be manually re-enabled when switching back to survival
# if disabled, the gamemode is forced to survival while in combat mode, and switching gamemodes is not possible until combat mode is disabled
allow_gamemode_switching: true

# Visual combat status indicator shown next to the player nametag.
# Uses scoreboard teams to add a suffix after the player name.
# Example: "PlayerName ⚔ Combat Mode"
combat_status_indicator:
  # Master toggle – set to false to completely disable the indicator
  enabled: true

  # Settings for when the player IS in combat mode
  in_combat:
    # Whether to show the indicator while in combat mode
    show: true
    # Text shown after the player name (supports & color codes)
    # The leading space separates it from the name
    text: " &c⚔"

  # Settings for when the player is NOT in combat mode
  not_in_combat:
    # Whether to show the indicator while not in combat mode
    show: false
    # Text shown after the player name (supports & color codes)
    text: " &a☮"
